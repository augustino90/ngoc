function shuffle(a){
 const result=[...a];
 for(let i=result.length-1;i>0;i--){
  const j=Math.floor(Math.random()*(i+1));
  [result[i],result[j]]=[result[j],result[i]];
 }

 // Delete words first to support databases with a restrictive foreign key.

}

async function editWord(id){
 const w=words.find(x=>String(x.id)===String(id));if(!w)return;
 const korean=prompt('Sửa từ tiếng Hàn:',w.korean);if(korean===null)return;
 const vietnamese=prompt('Sửa nghĩa tiếng Việt:',w.vietnamese);if(vietnamese===null)return;
 const ko=korean.trim(),vi=vietnamese.trim();
 if(!ko||!vi)return alert('Từ tiếng Hàn và nghĩa tiếng Việt không được để trống.');

 const index=cats.findIndex(c=>String(c.id)===String(w.category_id));
 const choice=prompt('Chọn chủ đề bằng số (1-'+cats.length+'):\n'+options,String(index+1));

}

function exportCSV(){
 let rows=[['korean','vietnamese','category']].concat(words.map(w=>[w.korean,w.vietnamese,catName(w.category_id)]));

 let a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\\ufeff'+csv],{type:'text/csv;charset=utf-8'}));a.download='korean-vocab.csv';a.click()
}
// CSV parser supporting quoted commas, escaped quotes, CRLF and quoted newlines.
function parseCSV(text){
 const rows=[];let row=[],field='',quoted=false;
 text=String(text).replace(/^\uFEFF/,'');
 for(let i=0;i<text.length;i++){
  const ch=text[i];
  if(quoted){if(ch==='"'&&text[i+1]==='"'){field+='"';i++}else if(ch==='"')quoted=false;else field+=ch}
  else if(ch==='"'&&field==='')quoted=true;
  else if(ch===','){row.push(field);field=''}
  else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(field);if(row.some(v=>v.trim()))rows.push(row);row=[];field=''}
  else field+=ch;
 }
 if(quoted)throw Error('CSV có dấu ngoặc kép chưa đóng.');
 row.push(field);if(row.some(v=>v.trim()))rows.push(row);
 return rows;
}
function parseBulkText(text){
 const rows=[];
 for(const [i,line] of String(text).split(/\r?\n/).entries()){
  if(!line.trim())continue;
  const match=line.match(/^\s*(.*?)\s*(?:\t|\s*[=|]\s*)(.*?)\s*$/);
  if(!match){rows.push({korean:line.trim(),vietnamese:'',category:'',source:i+1});continue}
  rows.push({korean:match[1].trim(),vietnamese:match[2].trim(),category:'',source:i+1});
 }
 return rows;
}
function previewBulkText(){
 const text=$('#bulkText')?.value||'';
 bulkRows=parseBulkText(text);bulkSource='text';renderBulkPreview();
}
async function previewBulkCSV(file){
 if(!file)return;
 try{
  const data=parseCSV(await file.text());
  if(!data.length)throw Error('File CSV trống.');
  const head=data[0].map(x=>x.trim().toLowerCase());
  const hasHeader=head.includes('korean')&&head.includes('vietnamese');
  const ki=hasHeader?head.indexOf('korean'):0,vi=hasHeader?head.indexOf('vietnamese'):1,ci=hasHeader?head.indexOf('category'):2;
  bulkRows=data.slice(hasHeader?1:0).map((r,i)=>({korean:(r[ki]||'').trim(),vietnamese:(r[vi]||'').trim(),category:(r[ci]||'').trim(),source:i+1+(hasHeader?1:0)}));
  bulkSource='csv';renderBulkPreview();
 }catch(e){alert('Không đọc được CSV: '+e.message)}
}
async function importCSV(file){return previewBulkCSV(file)}
function bulkDuplicateFlags(){
 const catId=$('#bulkCat')?.value||selectedAddCat;
 const current=new Set(words.map(w=>String(w.category_id)+'\u0000'+w.korean.trim().toLocaleLowerCase()));
 const seen=new Set();
 return bulkRows.map(r=>{
  const name=(r.category||'').trim();
  const cid=name?(cats.find(c=>c.name.toLocaleLowerCase()===name.toLocaleLowerCase())?.id||'new:'+name.toLocaleLowerCase()):catId;
  const key=String(cid)+'\u0000'+r.korean.trim().toLocaleLowerCase();
  const invalid=!r.korean.trim()||!r.vietnamese.trim()||!cid;
  const duplicate=!invalid&&(current.has(key)||seen.has(key));
  if(!invalid)seen.add(key);
  return {invalid,duplicate,cid};
 });
}
function renderBulkPreview(){
 const el=$('#bulkPreview');if(!el)return;
 if(!bulkRows.length){el.innerHTML='<p class="small">Không có từ nào để xem trước.</p>';return}
 const flags=bulkDuplicateFlags();
 const invalid=flags.filter(x=>x.invalid).length,dup=flags.filter(x=>x.duplicate).length;
 el.innerHTML=`<h3>Xem trước (${bulkRows.length} dòng)</h3><p class="small">${invalid} dòng thiếu thông tin · ${dup} từ trùng (sẽ bỏ qua). Có thể sửa trực tiếp bên dưới trước khi lưu.</p>
 <div class="import-scroll"><table class="import-table"><thead><tr><th>#</th><th>Tiếng Hàn</th><th>Tiếng Việt</th><th>Chủ đề (để trống = chủ đề đã chọn)</th><th>Trạng thái</th><th></th></tr></thead><tbody>
 ${bulkRows.map((r,i)=>`<tr><td>${r.source}</td><td><input lang="ko" value="${esc(r.korean)}" oninput="changeBulkRow(${i},'korean',this.value)"></td><td><input lang="vi" value="${esc(r.vietnamese)}" oninput="changeBulkRow(${i},'vietnamese',this.value)"></td><td><input value="${esc(r.category)}" placeholder="Chủ đề đã chọn" oninput="changeBulkRow(${i},'category',this.value)"></td><td id="bulkFlag${i}" class="${flags[i].invalid?'import-error':flags[i].duplicate?'import-error':'import-ok'}">${flags[i].invalid?'Thiếu dữ liệu':flags[i].duplicate?'Trùng':'Hợp lệ'}</td><td><button class="btn danger fit" onclick="removeBulkRow(${i})">Bỏ</button></td></tr>`).join('')}</tbody></table></div>
 <div class="row" style="margin-top:12px"><button class="btn" id="bulkSave" onclick="saveBulk()">Lưu các từ hợp lệ</button><button class="btn secondary fit" onclick="bulkRows=[];renderBulkPreview()">Hủy</button></div>
 <div id="bulkStatus" class="small" style="margin-top:8px"></div>`;
}
function changeBulkRow(i,key,value){if(!bulkRows[i])return;bulkRows[i][key]=value;updateBulkFlags()}
function updateBulkFlags(){
 const flags=bulkDuplicateFlags();flags.forEach((f,i)=>{const el=$('#bulkFlag'+i);if(!el)return;el.textContent=f.invalid?'Thiếu dữ liệu':f.duplicate?'Trùng':'Hợp lệ';el.className=f.invalid||f.duplicate?'import-error':'import-ok'});
}
function removeBulkRow(i){bulkRows.splice(i,1);renderBulkPreview()}
async function saveBulk(){
 if(bulkBusy)return;
 const flags=bulkDuplicateFlags();const pending=bulkRows.filter((r,i)=>!flags[i].invalid&&!flags[i].duplicate);
 if(!pending.length)return alert('Không có từ hợp lệ mới để lưu.');
 if(!confirm(`Lưu ${pending.length} từ mới? Các dòng trùng hoặc thiếu thông tin sẽ được bỏ qua.`))return;
 bulkBusy=true;const btn=$('#bulkSave');if(btn)btn.disabled=true;
 const status=$('#bulkStatus');if(status)status.textContent='Đang lưu...';
 let saved=0;
 try{
  const u=await user();if(!u)throw Error('Chưa đăng nhập.');
  const chosen=$('#bulkCat')?.value||selectedAddCat;
  const map=new Map(cats.map(c=>[c.name.toLocaleLowerCase(),c.id]));
  const payload=[];
  for(const r of pending){
   let cid=chosen;
   if(r.category.trim()){
    const name=r.category.trim(),key=name.toLocaleLowerCase();cid=map.get(key);
    if(!cid){const {data,error}=await sb.from('categories').insert({user_id:u.id,name}).select().single();if(error)throw error;cid=data.id;map.set(key,cid)}
   }
   payload.push({user_id:u.id,category_id:cid,korean:r.korean.trim(),vietnamese:r.vietnamese.trim()});
  }
  // Small batches avoid overly large requests and allow partial progress reporting.
  for(let i=0;i<payload.length;i+=100){
   const batch=payload.slice(i,i+100);const {error}=await sb.from('words').insert(batch);if(error)throw error;
   saved+=batch.length;if(status)status.textContent=`Đã lưu ${saved}/${payload.length} từ...`;
  }
  await loadData();currentFilterCat='all';bulkRows=[];wordsPage();alert(`Đã thêm ${saved} từ vựng thành công.`);
 }catch(e){await loadData().catch(()=>{});if(status)status.textContent=`Đã lưu ${saved} từ trước khi gặp lỗi. Hãy tải lại danh sách trước khi thử tiếp.`;err(e)}
 finally{bulkBusy=false;if(btn)btn.disabled=false}
}

function learnSetup(){
 main.innerHTML=`<div class="card"><h2>🎯 Chọn nội dung</h2><div class="checks">${cats.map(c=>`<label class="check"><input type="checkbox" class="catcheck" value="${c.id}"> ${esc(c.name)} (${words.filter(w=>String(w.category_id)===String(c.id)).length})</label>`).join('')}</div><div class="row" style="margin-top:12px"><button class="btn secondary fit" onclick="allCats()">Chọn tất cả</button><button class="btn secondary fit" onclick="clearCats()">Bỏ chọn</button></div></div>
 <div class="card"><h2>📝 Dạng bài</h2><div class="checks"><label class="check"><input class="modecheck" type="checkbox" value="v2k" checked> Việt → Hàn</label><label class="check"><input class="modecheck" type="checkbox" value="k2v" checked> Hàn → Việt</label><label class="check"><input class="modecheck" type="checkbox" value="mcq" checked> ABCD</label></div>
 <select id="count" style="margin-top:14px"><option value="10">10 câu</option><option value="20">20 câu</option><option value="30">30 câu</option><option value="9999">Tất cả</option></select>
 <label class="check" style="display:block;margin-top:12px"><input id="shuffleQuestions" type="checkbox" checked> Trộn thứ tự câu hỏi</label>
 <p class="small">Bỏ chọn để học theo thứ tự từ vựng đã lưu. Các câu trả lời sai sẽ được ôn lại ở cuối bài.</p>
 <button class="btn" style="width:100%;margin-top:12px" onclick="startQuiz()">Bắt đầu</button></div>`;
}
function allCats(){document.querySelectorAll('.catcheck').forEach(x=>x.checked=true)}function clearCats(){document.querySelectorAll('.catcheck').forEach(x=>x.checked=false)}
function startQuiz(){
 const cs=[...document.querySelectorAll('.catcheck:checked')].map(x=>x.value);
 const ms=[...document.querySelectorAll('.modecheck:checked')].map(x=>x.value);
 let pool=words.filter(w=>cs.includes(String(w.category_id)));
 if(!pool.length)return alert('Chọn ít nhất một mục có từ.');
 if(!ms.length)return alert('Chọn ít nhất một dạng bài.');
 const shouldShuffle=$('#shuffleQuestions').checked;
 if(shouldShuffle)pool=shuffle(pool);
 const selected=pool.slice(0,+$('#count').value);
 // Each item remembers its question mode across retries.
 quiz={pool:selected.map(w=>({word:w,mode:ms[Math.floor(Math.random()*ms.length)]})),
  retry:[],i:0,score:0,wrongFirst:0,attempts:0,answered:false,advancing:false,originalCount:selected.length};
 showQuestion();
}
function showQuestion(){
 if(quiz.nextTimer){clearTimeout(quiz.nextTimer);quiz.nextTimer=null}
 if(quiz.i>=quiz.pool.length){
  if(quiz.retry.length){quiz.pool=quiz.retry;quiz.retry=[];quiz.i=0;quiz.retryRound=true}
  else return finishQuiz();
 }
 const item=quiz.pool[quiz.i],w=item.word,mode=item.mode;
 quiz.current=w;quiz.mode=mode;quiz.answered=false;quiz.advancing=false;
 const q=mode==='v2k'?w.vietnamese:w.korean;
 const h=mode==='v2k'?'Viết tiếng Hàn':mode==='k2v'?'Viết nghĩa tiếng Việt':'Chọn nghĩa đúng';
 let out=`<div class="card quiz"><div>${quiz.retryRound?'🔁 Ôn câu sai · ':''}${quiz.i+1} / ${quiz.pool.length} · Đúng ${quiz.score} lượt</div><div class="progress"><i style="width:${quiz.i/quiz.pool.length*100}%"></i></div><div class="question">${esc(q)}</div><div class="small">${h}</div>`;
 if(mode==='mcq'){
  const opts=shuffle([w,...shuffle(words.filter(x=>String(x.id)!==String(w.id))).slice(0,3)]);
  out+=`<div class="answers">${opts.map(o=>`<button data-word-id="${esc(o.id)}" onclick="answerMCQ('${o.id}')">${esc(o.vietnamese)}</button>`).join('')}</div>`;
 }else{
  out+=`<div class="row" style="max-width:620px;margin:15px auto"><input id="answer" placeholder="${mode==='v2k'?'Gõ tiếng Hàn...':'Gõ nghĩa tiếng Việt...'}" onkeydown="if(event.key==='Enter')checkText()"><button class="btn fit" onclick="checkText()">Kiểm tra</button></div>`;
 }
 out+='<div id="feedback"></div></div>';main.innerHTML=out;
 if(mode!=='mcq')setTimeout(()=>$('#answer')?.focus(),30);
}
function norm(s){return String(s??'').toLowerCase().trim().replace(/\s+/g,' ')}
function checkText(){
 if(quiz.answered)return;
 const val=norm($('#answer').value);
 const ans=norm(quiz.mode==='v2k'?quiz.current.korean:quiz.current.vietnamese);
 answerDone(val===ans);
}
function answerMCQ(id){
 if(quiz.answered)return;
 document.querySelectorAll('.answers button').forEach(b=>b.classList.toggle('selected',b.dataset.wordId===String(id)));
 answerDone(String(id)===String(quiz.current.id));
}
function nextQuestion(){
 if(quiz.advancing)return;
 quiz.advancing=true;
 if(quiz.nextTimer){clearTimeout(quiz.nextTimer);quiz.nextTimer=null}
 quiz.i++;showQuestion();
}
async function answerDone(ok){
 if(quiz.answered)return;
 quiz.answered=true;
 const w=quiz.current;
 const item=quiz.pool[quiz.i];
 quiz.attempts++;
 if(!ok){
  quiz.retry.push(item);
  if(!quiz.retryRound)quiz.wrongFirst++;
 }else quiz.score++;
 const patch=ok?{correct_count:(w.correct_count||0)+1}:{wrong_count:(w.wrong_count||0)+1};
 const f=$('#feedback');
 f.className='feedback '+(ok?'correct':'wrong');
 f.innerHTML=ok?'✓ Chính xác!':`✗ Đáp án: <b>${esc(quiz.mode==='v2k'?w.korean:w.vietnamese)}</b>`;
 const b=document.createElement('button');b.className='btn';
 b.textContent='Câu tiếp theo →';b.onclick=nextQuestion;
 f.appendChild(document.createElement('br'));f.appendChild(b);
 // Wrong answers require a manual click; correct answers advance after 500 ms.
 if(ok)quiz.nextTimer=setTimeout(nextQuestion,500);
 const {error}=await sb.from('words').update(patch).eq('id',w.id);
 if(error){console.error(error);alert('Không lưu được tiến độ: '+(error.message||'Lỗi kết nối'))}
 else Object.assign(w,patch);
}
function finishQuiz(){
 const total=quiz.originalCount;
 const firstCorrect=total-quiz.wrongFirst;
 main.innerHTML=`<div class="card quiz"><h2>🎉 Hoàn thành</h2><div class="question">${total} / ${total} từ đã ôn xong</div><p>Đúng ngay lần đầu: ${firstCorrect}/${total} (${Math.round(firstCorrect/total*100)}%)</p><p>Đã làm lại ${quiz.attempts-total} lượt để ôn câu sai.</p><button class="btn" onclick="learnSetup()">Học lại</button></div>`;
}
function stats(){
 let total=words.reduce((a,w)=>a+w.correct_count+w.wrong_count,0),ok=words.reduce((a,w)=>a+w.correct_count,0);
 main.innerHTML=`<div class="grid"><div class="stat"><b>${total}</b><span>Tổng lượt</span></div><div class="stat"><b>${ok}</b><span>Đúng</span></div><div class="stat"><b>${total?Math.round(ok/total*100):0}%</b><span>Tỷ lệ đúng</span></div></div><div class="card"><h2>🔥 Từ cần ôn</h2><div class="list">${[...words].sort((a,b)=>b.wrong_count-a.wrong_count).slice(0,15).map(w=>`<div class="word"><div><div class="kr">${esc(w.korean)}</div><div class="vi">${esc(w.vietnamese)}</div></div><span class="tag">Sai ${w.wrong_count} · Đúng ${w.correct_count}</span></div>`).join('')}</div></div>`
}
sb?.auth.onAuthStateChange((event,session)=>{if(event==='SIGNED_IN'&&session)boot()});
boot();
</script></body></html>
